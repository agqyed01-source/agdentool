name: Deploy to VPS

on:
  push:
    branches:
      - main # Change this if your default branch is different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or the version you prefer

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/1panel/www/sites/agdentool" # Change this to your desired deployment path on the VPS
          rm: true # Optional: removes existing files in the target directory before copying
          exclude: ".git,.github,node_modules"

      - name: Execute deployment commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/1panel/www/sites/agdentool
            npm ci --production
            
            # Setup environment variables (e.g., VPS_PORT=3001) if not already set system-wide
            if ! grep -q "VPS_PORT=3001" .env; then
              echo "VPS_PORT=3001" >> .env
            fi
            
            # Install PM2 globally if not installed
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi
            
            # Restart or start the app with PM2
            pm2 restart my-app || pm2 start npm --name "my-app" -- run start
            pm2 save
