name: Deploy to VPS

on:
  push:
    branches:
      - main # Change this if your default branch is different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or the version you prefer

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_WOO_API_URL=${{ secrets.VITE_WOO_API_URL }}" > .env
          echo "VITE_WOO_CONSUMER_KEY=${{ secrets.VITE_WOO_CONSUMER_KEY }}" >> .env
          echo "VITE_WOO_CONSUMER_SECRET=${{ secrets.VITE_WOO_CONSUMER_SECRET }}" >> .env
          echo "VITE_WOO_CF7_ID=${{ secrets.VITE_WOO_CF7_ID }}" >> .env
          echo "VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}" >> .env
          echo "VITE_GTM_ID=${{ secrets.VITE_GTM_ID }}" >> .env
          echo "PORT=3001" >> .env

      - name: Build project
        run: npm run build

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/1panel/www/sites/agdentool" # Change this to your desired deployment path on the VPS
          rm: true # Optional: removes existing files in the target directory before copying
          exclude: ".git,.github,node_modules"

      - name: Execute deployment commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Add common Node.js paths to PATH
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/bin:$HOME/.local/bin

            # Load NVM or other Node environment managers if they exist
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Search for npm in common 1Panel and system locations
            if ! command -v npm &> /dev/null; then
              echo "Searching for npm in 1Panel apps..."
              # Search in /opt/1panel/apps for any node/bin directory
              ONEPANEL_NODE=$(find /opt/1panel/apps -name "npm" -type f -executable 2>/dev/null | head -n 1)
              if [ -n "$ONEPANEL_NODE" ]; then
                export PATH="$(dirname "$ONEPANEL_NODE"):$PATH"
                echo "Found npm at $ONEPANEL_NODE, added to PATH."
              else
                # Check other common custom paths
                POSSIBLE_PATHS=("/usr/local/node/bin" "/usr/local/bin" "/opt/node/bin" "/opt/1panel/node/bin")
                for p in "${POSSIBLE_PATHS[@]}"; do
                  if [ -d "$p" ]; then
                    export PATH="$p:$PATH"
                    if command -v npm &> /dev/null; then break; fi
                  fi
                done
              fi
            fi

            cd /opt/1panel/www/sites/agdentool
            
            # Final check for npm, if still not found, try to install it using nvm
            if ! command -v npm &> /dev/null; then
              echo "Error: npm not found in PATH ($PATH)."
              echo "Trying to automatically install Node.js via NVM..."
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash || true
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm install 20
              nvm alias default 20
              nvm use 20
            fi

            if ! command -v npm &> /dev/null; then
              echo "Failed to install Node.js automatically. Please SSH into your VPS and install Node.js manually."
              exit 1
            fi

            echo "Using Node: $(node -v)"
            echo "Using npm from: $(which npm)"
            
            npm ci --production
            
            # Ensure .env exists
            touch .env
            
            # Setup environment variables
            if ! grep -q "VPS_PORT=3001" .env; then
              echo "VPS_PORT=3001" >> .env
            fi
            
            # Install PM2 globally if not installed
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2 || echo "PM2 install failed, checking if already available..."
            fi
            
            # Use absolute path to pm2 or try to find it
            PM2_BIN=$(which pm2 || echo "$(npm config get prefix)/bin/pm2" || echo "$HOME/.npm-global/bin/pm2")
            
            # Restart or start the app with PM2
            $PM2_BIN restart my-app || $PM2_BIN start npm --name "my-app" -- run start
            $PM2_BIN save
