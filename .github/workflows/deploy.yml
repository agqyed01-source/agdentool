name: Deploy to VPS

on:
  push:
    branches:
      - main # Change this if your default branch is different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or the version you prefer

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/1panel/www/sites/agdentool" # Change this to your desired deployment path on the VPS
          rm: true # Optional: removes existing files in the target directory before copying
          exclude: ".git,.github,node_modules"

      - name: Execute deployment commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Load NVM or other Node environment managers if they exist
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.bashrc" ] && source "$HOME/.bashrc"
            [ -s "$HOME/.profile" ] && source "$HOME/.profile"
            
            cd /opt/1panel/www/sites/agdentool
            
            # Ensure npm is available
            if ! command -v npm &> /dev/null; then
              echo "Error: npm not found. Please ensure Node.js is installed and in the PATH."
              exit 1
            fi

            npm ci --production
            
            # Ensure .env exists
            touch .env
            
            # Setup environment variables
            if ! grep -q "VPS_PORT=3001" .env; then
              echo "VPS_PORT=3001" >> .env
            fi
            
            # Install PM2 globally if not installed
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi
            
            # Use absolute path to pm2 if just installed globally
            PM2_BIN=$(which pm2 || echo "$HOME/.npm-global/bin/pm2")
            
            # Restart or start the app with PM2
            $PM2_BIN restart my-app || $PM2_BIN start npm --name "my-app" -- run start
            $PM2_BIN save
